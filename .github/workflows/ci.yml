name: CI

# Lint + unit tests + production build on every push/PR to mathclass/main
# (this repo's only active line since the 2026-08-25 repo split; the Raccord
# line now lives in the separate `raccord` repo). Tests cover the
# persistence workflows, public resource boundaries, and asset checks. Build
# checks the committed portrait manifest and JPEGs offline, then renders theorems
# and health metadata; no private assets or download step is needed.

on:
  push:
    branches: [mathclass/main]
  pull_request:
    branches: [mathclass/main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

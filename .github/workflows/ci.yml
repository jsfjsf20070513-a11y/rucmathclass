name: CI

# 对 mathclass/main 的推送和 PR 执行 lint、单测、构建。
# 这些检查不连接生产数据库，也不执行部署。

on:
  push:
    branches: [mathclass/main]
  pull_request:
    branches: [mathclass/main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Worker bundle (no deployment)
        run: npm run worker:check
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium

      - name: Check mobile and desktop flows
        run: npm run browser:check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: output/playwright/
          retention-days: 7

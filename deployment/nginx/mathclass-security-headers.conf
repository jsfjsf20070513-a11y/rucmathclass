add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: all scripts are now external same-origin files (the two former inline
# boot scripts were moved to /boot-start.js and /boot-loading.js), so
# script-src is plain 'self' with no per-build hashes to maintain. connect-src
# allows Supabase (REST + realtime wss) and the optional Open-Meteo weather request. style-src needs
# 'unsafe-inline' for the inline <style> block + pre-rendered KaTeX inline
# style attributes. No wasm/eval in the bundle, so no 'unsafe-eval'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

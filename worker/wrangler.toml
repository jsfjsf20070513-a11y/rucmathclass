name = "mathclass-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = false

# Gemini TTS 预置声音名(多语种,支持法语)。可选:Kore/Aoede/Leda/Callirrhoe/
# Vindemiatrix 等约 30 个。换声音改这里重 deploy,或在 CF 控制台改 Variables 的
# TTS_VOICE(代码 env.TTS_VOICE 优先,缓存按声音区分)。
[vars]
TTS_VOICE = "Kore"
# 答疑先用 OpenAI，失败或超额时换 Gemini。模型必须在 src/openai.js 的价目表里。
# 思考强度可选 none/minimal/low/medium/high；越高越准也越慢。OpenAI 最多等 90 秒，前端最多等 120 秒。
OPENAI_MODEL = "gpt-6.1-terra"
OPENAI_REASONING = "high"
# 例外：从背词“请助手解释”发出的第一问固定用 low（网页只能调低，不能调高）。
# 不限个人次数，只限全站花费（美元，按用量估算，偏高）。
# 每天上限防一天内被刷光（北京时间零点重置）；周期上限按订阅续费日（1–28）切分。
OPENAI_DAILY_BUDGET_USD = "3"
OPENAI_PERIOD_BUDGET_USD = "20"
OPENAI_BUDGET_RESET_DAY = "1"

# OpenAI 计数存在 KV。没有这个绑定时不调用 OpenAI，全部由 Gemini 回答。
# 启用：npx wrangler kv namespace create AI_QUOTA --config worker/wrangler.toml，
# 把返回的 id 填进下面再取消注释。
# [[kv_namespaces]]
# binding = "AI_QUOTA"
# id = ""

# 路由:生产域名下的 /api/chat 绑到本 Worker(同域,前端同源调用)。
# 静态站其余路径仍由源站提供，聊天和语音请求走 Worker。
[[routes]]
pattern = "rucmathclass.com/api/chat"
zone_name = "rucmathclass.com"

# 带通配符,否则 ?text=… 的请求不会匹配路由(会漏到源站)。
[[routes]]
pattern = "rucmathclass.com/api/speak*"
zone_name = "rucmathclass.com"

# 限流绑定:每 IP 每 60s 最多 30 次。
# namespace_id 是自取的整数标识。绑定缺失或出错时返回 503，不调用模型。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# ⚠️ API key 绝不写进本文件。它们是 secret:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put OPENAI_API_KEY（可不配；不配时只用 Gemini）
# 登录校验还需 SUPABASE_URL 和 SUPABASE_ANON_KEY；使用与前端相同的
# Supabase 项目及公开客户端 key，均作为 Worker secret 单独配置。
# 不使用 service_role，也不复用用户的 access token 作为服务配置。

name = "mathclass-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = false

# Gemini TTS 预置声音名(多语种,支持法语)。可选:Kore/Aoede/Leda/Callirrhoe/
# Vindemiatrix 等约 30 个。换声音改这里重 deploy,或在 CF 控制台改 Variables 的
# TTS_VOICE(代码 env.TTS_VOICE 优先,缓存按声音区分)。
[vars]
TTS_VOICE = "Kore"

# 路由:生产域名下的 /api/chat 绑到本 Worker(同域,前端同源调用)。
# 静态站其余路径仍由 Vultr 源站经 Cloudflare 代理提供;只有 /api/chat 走 Worker。
[[routes]]
pattern = "rucmathclass.com/api/chat"
zone_name = "rucmathclass.com"

# 带通配符,否则 ?text=… 的请求不会匹配路由(会漏到源站)。
[[routes]]
pattern = "rucmathclass.com/api/speak*"
zone_name = "rucmathclass.com"

# 限流绑定:每 IP 每 60s 最多 30 次。
# namespace_id 是自取的整数标识。代码里 env.RATE_LIMITER 缺失会自动跳过。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# ⚠️ API key 绝不写进本文件。它们是 secret:
#   wrangler secret put GEMINI_API_KEY
